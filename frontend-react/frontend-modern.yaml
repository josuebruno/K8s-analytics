apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-frontend-modern
  namespace: analytics-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-frontend-modern

  template:
    metadata:
      labels:
        app: analytics-frontend-modern

    spec:
      # Credencial para pull da imagem privada no Harbor.
      imagePullSecrets:
        - name: harbor-analytics

      containers:
        - name: frontend

          # Imagem centralizada no Harbor.
          image: harbor.ipea.gov.br/desenvolvimento/analytics-frontend-modern:2.7
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-frontend-modern
  namespace: analytics-system

spec:
  type: NodePort

  selector:
    app: analytics-frontend-modern

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30082
