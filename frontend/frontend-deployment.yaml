apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-frontend
  namespace: analytics-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-frontend
  template:
    metadata:
      labels:
        app: analytics-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: masterlab01
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: localhost/analytics-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-frontend
  namespace: analytics-system
spec:
  type: NodePort
  selector:
    app: analytics-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
