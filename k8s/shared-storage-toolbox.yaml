apiVersion: v1
kind: Pod
metadata:
  name: analytics-shared-toolbox
  namespace: analytics-system
spec:
  restartPolicy: Never
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: analytics-shared-pvc
---
