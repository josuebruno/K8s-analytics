apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-python-test
  namespace: analytics-jobs

  labels:
    app: analytics-worker
    language: python
    purpose: test

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app: analytics-worker
        language: python
        purpose: test

    spec:
      restartPolicy: Never

      nodeSelector:
        analytics-worker: "true"

      automountServiceAccountToken: false

      imagePullSecrets:
        - name: harbor-analytics

      containers:
        - name: worker
          image: harbor.ipea.gov.br/desenvolvimento/analytics-worker-python:2.0
          imagePullPolicy: IfNotPresent

          args:
            - "--data-format"
            - "csv"

            - "--data-path"
            - "/data/clientes.csv"

            - "--ram-limit-gb"
            - "2"

            - "--cpus"
            - "1"

            - "--output-dir"
            - "/output"

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"

            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: shared-data
              mountPath: /data
              subPath: testdata

            - name: shared-data
              mountPath: /output
              subPath: jobs

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: analytics-shared-pvc
