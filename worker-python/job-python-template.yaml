apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-python-template
  namespace: analytics-jobs

  labels:
    app: analytics-worker
    language: python

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app: analytics-worker
        language: python

    spec:
      restartPolicy: Never

      # O Job pode executar em qualquer worker Analytics.
      nodeSelector:
        analytics-worker: "true"

      # O Job não precisa acessar a API do Kubernetes.
      automountServiceAccountToken: false

      # Credencial para pull da imagem privada no Harbor.
      imagePullSecrets:
        - name: harbor-analytics

      containers:
        - name: worker
          image: harbor.ipea.gov.br/desenvolvimento/analytics-worker-python:2.0
          imagePullPolicy: IfNotPresent

          args:
            - "--data-format"
            - "csv"

            - "--data-path"
            - "/data/clientes.csv"

            - "--ram-limit-gb"
            - "2"

            - "--cpus"
            - "1"

            - "--output-dir"
            - "/output"

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"

            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            # Dataset compartilhado.
            - name: shared-data
              mountPath: /data
              subPath: testdata

            # Resultados persistentes.
            - name: shared-data
              mountPath: /output
              subPath: jobs

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: analytics-shared-pvc
