apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: analytics-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-api

  template:
    metadata:
      labels:
        app: analytics-api

    spec:
      serviceAccountName: analytics-api

      nodeSelector:
        analytics-worker: "true"

      imagePullSecrets:
        - name: harbor-analytics

      containers:
        - name: api
          image: harbor.ipea.gov.br/desenvolvimento/analytics-api:2.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              protocol: TCP

          env:
            # PostgreSQL
            - name: DB_HOST
              value: analytics-postgres.analytics-system.svc.cluster.local

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-secret
                  key: POSTGRES_PASSWORD

            # Active Directory
            - name: AD_HOST
              value: "10.1.1.70"

            - name: AD_PORT
              value: "389"

            - name: AD_USE_SSL
              value: "false"

            - name: AD_DOMAIN
              value: "IPEA.GOV.BR"

            - name: AD_BASE_DN
              value: "DC=ipea,DC=gov,DC=br"

            - name: AD_GROUP_CN
              value: "GestaoAD"

            # Sessão
            - name: SESSION_COOKIE_NAME
              value: "analytics_session"

            - name: SESSION_TTL_HOURS
              value: "12"

            # Storage compartilhado
            - name: SHARED_ROOT
              value: "/shared"

            - name: SHARED_NFS_SERVER
              value: "10.100.58.50"

            - name: SHARED_NFS_EXPORT
              value: "/1"

          command:
            - /bin/sh
            - -c

          args:
            - |
              mkdir -p /root/.kube

              cat > /root/.kube/config <<KCFG
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  namespace: analytics-system
                  user: serviceaccount
                name: in-cluster
              current-context: in-cluster
              users:
              - name: serviceaccount
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              KCFG

              uvicorn main:app --host 0.0.0.0 --port 8000

          volumeMounts:
            - name: shared-data
              mountPath: /shared

            - name: shared-data
              mountPath: /opt/analytics/k8s-output/jobs
              subPath: jobs

            - name: shared-data
              mountPath: /opt/analytics/generated-jobs
              subPath: generated-jobs

            - name: shared-data
              mountPath: /opt/analytics/code-runs
              subPath: code-runs

            - name: shared-data
              mountPath: /opt/analytics/code-runs-r
              subPath: code-runs-r

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: analytics-shared-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: analytics-system

spec:
  type: NodePort

  selector:
    app: analytics-api

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
