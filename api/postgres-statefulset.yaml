apiVersion: v1
kind: Service
metadata:
  name: analytics-postgres
  namespace: analytics-system
spec:
  selector:
    app: analytics-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics-postgres
  namespace: analytics-system
spec:
  serviceName: analytics-postgres
  replicas: 1
  selector:
    matchLabels:
      app: analytics-postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: analytics-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: masterlab01
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: analytics-postgres-pvc
