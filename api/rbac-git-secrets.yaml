apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api
  namespace: analytics-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analytics-api-secrets-role
  namespace: analytics-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analytics-api-secrets-binding
  namespace: analytics-system
subjects:
  - kind: ServiceAccount
    name: analytics-api
    namespace: analytics-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analytics-api-secrets-role
